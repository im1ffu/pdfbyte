<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Byte — Secure</title>
<style>
:root{--violet:#8b5cf6;--cyan:#22d3ee;--pink:#ec4899;--text:#f8fafc;--muted:#9aa3b8}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{
 overflow:hidden;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:#07080d;
}
#lock{position:relative;width:100%;height:100%;display:grid;place-items:center;overflow:hidden;
 background:
 radial-gradient(circle at 15% 20%,rgba(139,92,246,.24),transparent 28%),
 radial-gradient(circle at 85% 75%,rgba(34,211,238,.18),transparent 30%),
 radial-gradient(circle at 55% 105%,rgba(236,72,153,.12),transparent 25%),
 #07080d;
}
#grid{position:absolute;inset:-30%;opacity:.16;transform:perspective(600px) rotateX(62deg) translateY(20%);
 background-image:linear-gradient(rgba(139,92,246,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.35) 1px,transparent 1px);
 background-size:55px 55px;animation:gridMove 13s linear infinite}
#orb1,#orb2,#orb3{position:absolute;border-radius:50%;filter:blur(2px);pointer-events:none}
#orb1{width:280px;height:280px;background:radial-gradient(circle,rgba(139,92,246,.32),transparent 68%);left:4%;top:8%;animation:orbA 8s ease-in-out infinite}
#orb2{width:360px;height:360px;background:radial-gradient(circle,rgba(34,211,238,.20),transparent 68%);right:2%;bottom:0;animation:orbB 10s ease-in-out infinite}
#orb3{width:190px;height:190px;background:radial-gradient(circle,rgba(236,72,153,.18),transparent 68%);left:50%;top:2%;animation:orbC 7s ease-in-out infinite}
.card{position:relative;z-index:5;width:min(440px,92vw);padding:34px 30px 27px;border:1px solid rgba(255,255,255,.13);border-radius:30px;
 background:linear-gradient(145deg,rgba(20,22,34,.82),rgba(8,10,17,.78));backdrop-filter:blur(26px) saturate(150%);
 -webkit-backdrop-filter:blur(26px) saturate(150%);box-shadow:0 35px 100px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);
 transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .14s ease-out;
}
.card:before{content:"";position:absolute;inset:-1px;border-radius:30px;padding:1px;background:linear-gradient(120deg,rgba(139,92,246,.8),transparent 35%,rgba(34,211,238,.55),transparent 70%,rgba(236,72,153,.55));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.logo{display:flex;align-items:center;justify-content:center;gap:13px}
.logoMark{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:25px;
 background:linear-gradient(135deg,var(--violet),#6366f1 48%,var(--cyan));box-shadow:0 12px 35px rgba(99,102,241,.4);animation:logo 3s ease-in-out infinite}
.logo h1{margin:0;font-size:25px;letter-spacing:.1em}.logo small{display:block;margin-top:2px;color:#8991a6;font-size:10px;letter-spacing:.22em}
.owner{text-align:center;margin:19px 0 24px}
.owner span{font-size:18px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:transparent;background:linear-gradient(90deg,#fff,var(--violet),var(--cyan),#fff);background-size:250% auto;background-clip:text;-webkit-background-clip:text;animation:shine 3.2s linear infinite;filter:drop-shadow(0 0 12px rgba(139,92,246,.3))}
.owner:after{content:"";display:block;width:76px;height:2px;margin:9px auto 0;border-radius:4px;background:linear-gradient(90deg,transparent,var(--cyan),var(--violet),transparent);box-shadow:0 0 15px var(--cyan)}
.lockIcon{width:92px;height:92px;margin:0 auto 15px;border-radius:28px;display:grid;place-items:center;font-size:42px;
 background:linear-gradient(145deg,rgba(139,92,246,.16),rgba(34,211,238,.08));border:1px solid rgba(255,255,255,.09);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 18px 45px rgba(0,0,0,.22);animation:float 3.8s ease-in-out infinite}
.title{text-align:center;font-size:20px;font-weight:800;margin:0 0 5px}.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 20px}
#pin{width:100%;height:58px;border:1px solid rgba(255,255,255,.13);border-radius:17px;outline:0;background:rgba(255,255,255,.055);color:#fff;text-align:center;font-size:24px;font-weight:800;letter-spacing:.42em;transition:.2s}
#pin:focus{border-color:rgba(139,92,246,.85);box-shadow:0 0 0 4px rgba(139,92,246,.12),0 0 35px rgba(139,92,246,.14)}
#unlock{width:100%;height:54px;margin-top:12px;border:0;border-radius:17px;color:#fff;font-weight:850;font-size:15px;cursor:pointer;
 background:linear-gradient(110deg,var(--violet),#6366f1,var(--cyan));background-size:220% 100%;box-shadow:0 13px 35px rgba(99,102,241,.28);transition:.18s}
#unlock:hover{transform:translateY(-2px);background-position:100% 0;box-shadow:0 18px 42px rgba(34,211,238,.22)}
#unlock:active{transform:translateY(1px)}#unlock:disabled{opacity:.7;cursor:wait}
#error{height:22px;text-align:center;color:#fb7185;font-size:13px;font-weight:700;margin-top:9px}
.footer{text-align:center;color:#626b80;font-size:11px;margin-top:7px}
.pulse{animation:shake .42s ease}
@keyframes gridMove{to{transform:perspective(600px) rotateX(62deg) translateY(75px)}}
@keyframes orbA{50%{transform:translate(45px,28px) scale(1.1)}}@keyframes orbB{50%{transform:translate(-40px,-35px) scale(1.08)}}@keyframes orbC{50%{transform:translate(-25px,40px)}}
@keyframes logo{50%{transform:translateY(-3px) rotate(2deg);box-shadow:0 17px 42px rgba(139,92,246,.48)}}
@keyframes shine{to{background-position:250% center}}@keyframes float{50%{transform:translateY(-5px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
</style>
</head>
<body>
<div id="lock">
 <div id="grid"></div><div id="orb1"></div><div id="orb2"></div><div id="orb3"></div>
 <section class="card" id="card">
  <div class="logo"><div class="logoMark">✦</div><div><h1>PDF BYTE</h1><small>SECURE WORKSPACE</small></div></div>
  <div class="owner"><span>IRFAN MEHRAJ</span></div>
  <div class="lockIcon" id="lockIcon">🔐</div>
  <h2 class="title" id="title">Protected Workspace</h2>
  <p class="sub" id="sub">Enter your PIN to unlock PDF Byte</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="32" placeholder="••••••">
  <button id="unlock">🔓 &nbsp; Unlock PDF Byte</button>
  <div id="error"></div>
  <div class="footer">Locally protected • PDF Byte</div>
 </section>
</div>

const APP_SHA256="bdb3ad5a34b8c4418149df3eda91d6f547650a0709c80904d6988fb248a36625";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const pin=document.getElementById("pin"),btn=document.getElementById("unlock"),err=document.getElementById("error");
const card=document.getElementById("card"),icon=document.getElementById("lockIcon"),title=document.getElementById("title"),sub=document.getElementById("sub");
document.getElementById("lock").addEventListener("mousemove",e=>{
 const r=card.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 const nx=x/r.width-.5,ny=y/r.height-.5;
 if(x>=0&&x<=r.width&&y>=0&&y<=r.height){card.style.setProperty("--ry",(nx*5).toFixed(2)+"deg");card.style.setProperty("--rx",(-ny*4).toFixed(2)+"deg")}
});
document.getElementById("lock").addEventListener("mouseleave",()=>{card.style.setProperty("--ry","0deg");card.style.setProperty("--rx","0deg")});
pin.addEventListener("focus",()=>{icon.textContent="👀";title.textContent="I’m Watching";sub.textContent="Enter your PIN to continue"}); 
pin.addEventListener("input",()=>{err.textContent="";icon.textContent=pin.value?"🧿":"👀"});
async function unlock(){
 err.textContent="";
 const now=Date.now();
 try{
  const until=Number(sessionStorage.getItem("pb_lock_until")||0);
  if(until>now){err.textContent="Too many attempts — try again in "+Math.ceil((until-now)/1000)+"s.";return;}
 }catch(_){}
 btn.disabled=true;btn.textContent="⏳  Checking PIN…";icon.textContent="🛡️";title.textContent="Verifying";sub.textContent="Decrypting your workspace…";
 try{
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin.value),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(S),iterations:600000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(I)},key,b64(C));
  let appHtml=new TextDecoder().decode(plain);
  const digest=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(appHtml));
  const digestHex=[...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,"0")).join("");
  if(digestHex!==APP_SHA256) throw new Error("Integrity check failed");
  btn.textContent="✓  Access granted";icon.textContent="✨";title.textContent="Unlocked";sub.textContent="Opening PDF Byte…";
  const frame=document.createElement("iframe");
  frame.setAttribute("referrerpolicy","no-referrer");
  frame.style.cssText="position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;z-index:999999";
  const lock=document.getElementById("lock");
  lock.style.display="none";
  window.addEventListener("message",e=>{
   if(e.source!==frame.contentWindow || !(e.data==="PDF_BYTE_GO_BACK" || e.data?.type==="PDF_BYTE_GO_BACK")) return;
   if(confirm("Are you sure you want to go back to the PDF Byte login page?\n\nAny unsaved work in the current workspace may be lost.")){
    frame.remove();lock.style.display="grid";pin.value="";err.textContent="";icon.textContent="🔐";title.textContent="Protected Workspace";sub.textContent="Enter your PIN to unlock PDF Byte";btn.disabled=false;btn.textContent="🔓  Unlock PDF Byte";setTimeout(()=>pin.focus(),100);
   }
  });
  const attachLogoBackHandler=()=>{
   try{
    const doc=frame.contentDocument;if(!doc || doc._pdfByteBackHandlerAttached)return;
    doc._pdfByteBackHandlerAttached=true;
    const norm=v=>(v||"").replace(/\s+/g," ").trim().toUpperCase();
    const isLogoElement=el=>{
     if(!el || el.nodeType!==1)return false;
     const text=norm(el.textContent),aria=norm(el.getAttribute&&el.getAttribute("aria-label")),title=norm(el.getAttribute&&el.getAttribute("title"));
     const cls=norm(el.className&&typeof el.className==="string"?el.className:""),id=norm(el.id||"");
     return text==="PDF BYTE" || aria==="PDF BYTE" || title==="PDF BYTE" || /\bPDF\s*BYTE\b/.test(text)&&(cls.includes("LOGO")||id.includes("LOGO")||el.tagName==="H1"||el.tagName==="H2");
    };
    doc.addEventListener("click",ev=>{
     let node=ev.target,matched=null;
     for(let i=0;node&&i<10;i++,node=node.parentElement){if(isLogoElement(node)){matched=node;break;}}
     if(!matched&&ev.composedPath)for(const n of ev.composedPath()){if(n&&n.nodeType===1&&isLogoElement(n)){matched=n;break;}}
     if(!matched)return;ev.preventDefault();ev.stopPropagation();ev.stopImmediatePropagation?.();parent.postMessage({type:"PDF_BYTE_GO_BACK"},"*");
    },true);
    const markLogo=root=>{try{root.querySelectorAll("*").forEach(el=>{if(isLogoElement(el)){el.style.cursor="pointer";el.setAttribute("title","Back to PDF Byte login");}})}catch(_){} };
    markLogo(doc);const observer=new MutationObserver(()=>markLogo(doc));observer.observe(doc.documentElement,{subtree:true,childList:true,characterData:true});frame._pdfByteObserver=observer;
   }catch(_){}
  };
  frame.srcdoc=appHtml;appHtml="";frame.addEventListener("load",attachLogoBackHandler,{once:false});document.body.appendChild(frame);
  try{sessionStorage.removeItem("pb_failed");sessionStorage.removeItem("pb_lock_until");}catch(_){}
 }catch(e){
  card.classList.remove("pulse");void card.offsetWidth;card.classList.add("pulse");
  icon.textContent="🙈";title.textContent="Access denied";sub.textContent="The PIN or protected workspace is invalid.";err.textContent="Incorrect PIN — try again.";
  try{const n=Number(sessionStorage.getItem("pb_failed")||0)+1;sessionStorage.setItem("pb_failed",String(n));if(n>=5){const strikes=n-4;const delay=Math.min(300000,15000*Math.pow(2,Math.min(strikes-1,4)));sessionStorage.setItem("pb_lock_until",String(Date.now()+delay));}}catch(_){ }
  btn.disabled=false;btn.textContent="🔓  Unlock PDF Byte";pin.select();
 }
}
btn.addEventListener("click",unlock);pin.addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});
pin.addEventListener("input",()=>{pin.value=pin.value.replace(/\D/g,"");err.textContent=""});
setTimeout(()=>pin.focus(),300);
</script>
